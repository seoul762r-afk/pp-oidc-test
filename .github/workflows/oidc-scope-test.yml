name: oidc-scope-test

on:
  workflow_dispatch:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  scope_probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: printf 'private packagist oidc scope test artifact\n' > artifact.txt
      - name: probe credential scope
        run: python3 probe.py

  environment_variation:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: probe with an environment claim set
        env:
          MODE: variation
        run: python3 probe.py
