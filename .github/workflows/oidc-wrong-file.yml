name: oidc-wrong-file

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  wrong_file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe from a workflow file the publisher does not name
        env:
          MODE: variation
        run: python3 probe.py
