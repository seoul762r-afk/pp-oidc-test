name: probe-v2

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'results-*.txt'

permissions:
  id-token: write
  contents: write

jobs:
  # Runs WITHOUT an environment. The trusted publisher is configured with no
  # environment, so this job's OIDC token matches it.
  scope_probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe credential scope
        env:
          MODE: scope
          TAG: scope
        run: python3 probe2.py
      - name: publish results
        if: always()
        run: |
          git config user.name pp-oidc-probe
          git config user.email pp-oidc-probe@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            git add results-*.txt
            git diff --cached --quiet && { echo nothing-to-commit; exit 0; }
            git commit -m "results: scope run $GITHUB_RUN_ID" || true
            git push && exit 0
            sleep 5
          done
          exit 1

  # Same package, same repository, same workflow file, but this job declares an
  # environment the publisher does not. Sequential (needs:) so the two jobs'
  # commits cannot race.
  environment_variation:
    needs: scope_probe
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: probe with an environment claim set
        env:
          MODE: variation
          TAG: variation-env
        run: python3 probe2.py
      - name: publish results
        if: always()
        run: |
          git config user.name pp-oidc-probe
          git config user.email pp-oidc-probe@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            git add results-*.txt
            git diff --cached --quiet && { echo nothing-to-commit; exit 0; }
            git commit -m "results: variation-env run $GITHUB_RUN_ID" || true
            git push && exit 0
            sleep 5
          done
          exit 1
